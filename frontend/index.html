
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijju 2.5 Eco</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0d10;
    color: #f1f1f1;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #111418;
    border-right: 1px solid #292d33;
    padding: 16px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 22px;
}

.logo span {
    opacity: .6;
    font-size: 13px;
    display: block;
    margin-top: 5px;
}

.new-chat {
    border: 1px solid #30353c;
    background: #181c21;
    color: white;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.new-chat:hover {
    background: #20252b;
}

.sidebar-bottom {
    margin-top: auto;
    color: #777;
    font-size: 12px;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 58px;
    border-bottom: 1px solid #292d33;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: bold;
}

.status {
    margin-left: auto;
    font-size: 12px;
    color: #7fd89b;
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 15%;
}

.message {
    display: flex;
    gap: 13px;
    margin-bottom: 28px;
    line-height: 1.6;
}

.avatar {
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #20252b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}

.content {
    max-width: 800px;
    white-space: pre-wrap;
}

.user .avatar {
    background: #303640;
}

.assistant .avatar {
    background: #1c4531;
}

.sources {
    margin-top: 10px;
    padding: 10px;
    border-left: 2px solid #555;
    color: #aaa;
    font-size: 12px;
}

/* WELCOME */
.welcome {
    text-align: center;
    margin-top: 18vh;
}

.welcome h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: #888;
}

/* INPUT */
.input-area {
    padding: 15px 15%;
    border-top: 1px solid #292d33;
}

.input-box {
    display: flex;
    background: #171b20;
    border: 1px solid #343941;
    border-radius: 14px;
    padding: 7px;
}

textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    padding: 11px;
    font-size: 15px;
    min-height: 44px;
    max-height: 140px;
}

.send {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: #f1f1f1;
    color: #111;
    cursor: pointer;
    font-size: 18px;
}

.send:hover {
    background: #d8d8d8;
}

.typing {
    color: #888;
    font-size: 13px;
    margin-bottom: 15px;
}

/* MOBILE */
@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .chat,
    .input-area {
        padding-left: 12px;
        padding-right: 12px;
    }

    .welcome h1 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">
            Vijju 2.5 Eco
            <span>Small • Smart • Portable</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="sidebar-bottom">
            Vijju 2.5 Eco V1<br>
            Local AI + Web
        </div>
    </aside>

    <main class="main">

        <header class="header">
            Vijju 2.5 Eco
            <div class="status">● Local Model</div>
        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">
                <h1>What can I help with?</h1>
                <p>Ask Vijju anything.</p>
            </div>

        </section>

        <div class="input-area">

            <div class="typing" id="typing" style="display:none;">
                Vijju is thinking...
            </div>

            <div class="input-box">
                <textarea
                    id="input"
                    placeholder="Message Vijju..."
                    rows="1"></textarea>

                <button class="send" onclick="sendMessage()">
                    ↑
                </button>
            </div>

        </div>

    </main>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

function addMessage(type, text, sources="") {

    if (welcome) {
        welcome.style.display = "none";
    }

    const message = document.createElement("div");
    message.className = "message " + type;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = type === "user" ? "You" : "V";

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    if (sources) {
        const sourceBox = document.createElement("div");
        sourceBox.className = "sources";
        sourceBox.textContent = "Sources:\n" + sources;
        content.appendChild(sourceBox);
    }

    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    addMessage("user", text);
    input.value = "";
    typing.style.display = "block";

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        if (!res.ok) {
            throw new Error(`Server error: ${res.status}`);
        }

        const data = await res.json();

        addMessage(
            "assistant",
            data.response || "No response received.",
            (data.sources || []).join("\n")
        );

    } catch (error) {
        addMessage(
            "assistant",
            "Connection error: " + error.message
        );
    } finally {
        typing.style.display = "none";
    }
}

function newChat() {
    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>What can I help with?</h1>
            <p>Ask Vijju anything.</p>
        </div>
    `;
}

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }

});

</script>

</body>
</html>
